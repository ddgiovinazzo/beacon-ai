name: Daily Job Intelligence Scan

on:
  schedule:
    # Run daily at 12:00 UTC (8:00 AM EST / 7:00 AM CST)
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-scan-execution
  cancel-in-progress: false

jobs:
  scan-and-persist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BeaconAI Headless Scan with Notifications
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}
          NOTIFICATION_EMAIL_FROM: ${{ secrets.NOTIFICATION_EMAIL_FROM }}
        run: |
          python main.py scan \
            --profile profiles/bookkeeper.json.example \
            --feed "https://hudsonvalley.craigslist.org/search/acc?format=rss" \
            --notify

      - name: Persist SQLite State and Daily Digest Artifacts
        run: |
          git config user.name "BeaconAI Bot"
          git config user.email "bot@beaconai.local"
          git add matches.db artifacts/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(db): update scan state and daily digest [skip ci]" && git push)
