name: Daily Job Intelligence Scan

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      force_rescan:
        description: "Force re-evaluate all active postings (wipe cached matches.db)"
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-scan-execution
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Handle Force Rescan (Wipe Deduplication Cache)
        if: ${{ inputs.force_rescan == true || github.event.inputs.force_rescan == 'true' }}
        run: |
          echo "Force rescan requested: wiping matches.db to re-evaluate all active postings."
          rm -f matches.db

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inject Candidate Profile from Secret
        env:
          PROFILE_B64: ${{ secrets.USER_PROFILE_JSON_B64 }}
        run: |
          mkdir -p profiles
          echo "$PROFILE_B64" | base64 --decode > profiles/ephemeral_profile.json

      - name: Run Multi-Feed Intelligence Scan
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}
          NOTIFICATION_EMAIL_FROM: ${{ secrets.NOTIFICATION_EMAIL_FROM }}
          TARGET_FEEDS: ${{ vars.TARGET_FEED_URLS || secrets.TARGET_FEED_URLS }}
        run: |
          echo "$TARGET_FEEDS" | while IFS= read -r feed || [ -n "$feed" ]; do
            trimmed_feed=$(echo "$feed" | xargs)
            if [[ -n "$trimmed_feed" && ! "$trimmed_feed" =~ ^# ]]; then
              echo "==> Scanning Target Feed: $trimmed_feed"
              python main.py scan --profile profiles/ephemeral_profile.json --feed "$trimmed_feed" --notify || true
            fi
          done

      - name: Purge Ephemeral Profile
        if: always()
        run: rm -f profiles/ephemeral_profile.json

      - name: Commit Updated State (Zero-Storage Architecture)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add matches.db || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(automation): update scan state [skip ci]"
            git push origin main
          fi
