name: Manage Blocked Companies

on:
  workflow_dispatch:
    inputs:
      company_name:
        description: "Exact company or employer name"
        required: true
        type: string
      action:
        description: "Action to perform"
        required: true
        type: choice
        default: "block"
        options:
          - "block"
          - "unblock"
      reason:
        description: "Reason (for blocking only)"
        required: false
        type: string
        default: "Manual block via GitHub Action"

concurrency:
  group: cache-management-execution
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  manage_blocklist:
    name: Manage Blocklist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Block Company
        if: ${{ inputs.action == 'block' }}
        run: |
          echo "==> Blocking company: ${{ inputs.company_name }}"
          python main.py block-company "${{ inputs.company_name }}" --reason "${{ inputs.reason }}"

      - name: Unblock Company
        if: ${{ inputs.action == 'unblock' }}
        run: |
          echo "==> Unblocking company: ${{ inputs.company_name }}"
          python main.py unblock-company "${{ inputs.company_name }}"

      - name: List Current Blocklist
        run: python main.py list-blocked

      - name: Commit Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add matches.db || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(blocklist): ${{ inputs.action }} company '${{ inputs.company_name }}' [skip ci]"
            git push origin main
          fi
