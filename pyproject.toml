[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon-ai"
version = "0.2.0"
description = "Lightweight, modular, deterministic CLI job intelligence engine"
authors = [{ name = "BeaconAI Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.0",
    "jinja2>=3.1.4",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "litellm>=1.40.0",
    "instructor>=1.3.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
beacon = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
